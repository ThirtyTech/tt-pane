name: Release

# Like tt-git: native builds, a tag/version guard, archives and checksums.
# Manual runs build downloadable artifacts without publishing a release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "tt-pane") | .version')
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64 }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake pkg-config libssl-dev libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
      - name: Link Windows CRT statically
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"RUSTFLAGS=-C target-feature=+crt-static" >> $env:GITHUB_ENV'
      - name: Test
        run: cargo test --workspace --locked --no-default-features --target ${{ matrix.target }}
      - name: Build desktop app
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Windows installer and portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          ./packaging/windows/package.ps1 -BinDir 'target/${{ matrix.target }}/release' -Tag $env:RELEASE_TAG
      - name: Verify Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1 -BinDir 'target/${{ matrix.target }}/release' -Tag $env:RELEASE_TAG
      # tt-pane.app in a designed .dmg (packaging/macos/package.sh). Signed
      # and notarized when the MACOS_* secrets are set, ad hoc otherwise.
      - name: Package macOS app and disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: packaging/macos/package.sh "target/${{ matrix.target }}/release" "$RELEASE_TAG" "${{ matrix.platform }}" dist
      - name: Package Linux / macOS archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="tt-pane-$RELEASE_TAG-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/tt-pane" README.md "dist/$name/"
          # install.sh adds an app launcher with this icon on Linux.
          if [[ "${{ runner.os }}" == Linux ]]; then cp assets/tt-pane.png "dist/$name/"; fi
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -r "dist/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: tt-pane-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tt-pane-*
          path: dist
          merge-multiple: true
      - name: Add install scripts
        run: cp install.sh install.ps1 dist/
      - name: Checksums
        working-directory: dist
        run: sha256sum tt-pane-* install.sh install.ps1 > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh"
          {
            awk -v version="${GITHUB_REF_NAME#v}" '
              /^## / { if (found) exit; if ($2 == version) { found=1; next } }
              found { print }
            ' CHANGELOG.md
            echo
            echo '## Install tt-pane'
            echo
            echo 'macOS Apple Silicon: open the .dmg, drag tt-pane to Applications, then open it from Applications and allow Accessibility access when asked. It runs in the menu bar; no terminal is needed.'
            echo 'Unless the release says the macOS build is notarized, macOS blocks its first launch: choose Done, then System Settings → Privacy & Security → Open Anyway.'
            echo
            echo 'Linux x64, and the macOS command-line executable, into `~/.local`:'
            echo
            echo '```sh'
            echo "curl -fsSL $url | TTPANE_VERSION=$GITHUB_REF_NAME sh"
            echo '```'
            echo
            echo 'Or unpack the tar.gz and run tt-pane. See README.md in the archive for runtime dependencies.'
            echo
            echo 'Windows x64, in PowerShell (runs the setup silently, for your account only):'
            echo
            echo '```powershell'
            echo "\$env:TTPANE_VERSION = '$GITHUB_REF_NAME'; irm ${url%.sh}.ps1 | iex"
            echo '```'
            echo
            echo 'Or download the setup.exe for a per-user install, or unpack the portable ZIP.'
            echo 'tt-pane starts in the system tray / menu bar. Quit an existing instance before upgrading.'
            echo 'Windows and Linux packages are unsigned. SHA256SUMS.txt contains the SHA-256 checksum of each download.'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "tt-pane $GITHUB_REF_NAME" --notes-file notes.md --generate-notes "${prerelease[@]}"
