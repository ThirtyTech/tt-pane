<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">tt-pane window snapping preview</title>
  <desc id="description">Three monitor work areas show the active window in green: left half with Ctrl+Alt+1, centered at 50 percent width and height with Ctrl+Alt+3, and top-right quarter with Ctrl+Alt+9.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#102333"/>
      <stop offset="1" stop-color="#183b49"/>
    </linearGradient>
    <g id="monitor">
      <rect width="344" height="212" rx="12" fill="#0b1925" stroke="#398d99" stroke-width="2"/>
      <rect x="12" y="12" width="320" height="180" fill="#1b3544"/>
      <path d="M172 12v180M12 102h320" stroke="#42606f" stroke-dasharray="5 6"/>
      <path d="M172 212v14m-42 0h84" stroke="#73949f" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1200" height="450" rx="24" fill="url(#background)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="53" fill="#e6f4f5" font-size="28" font-weight="700">Your window. In position.</text>
    <text x="40" y="83" fill="#a9c7d0" font-size="17">Keyboard-first snapping on the active window's current monitor.</text>
    <g transform="translate(40 115)">
      <use href="#monitor"/>
      <rect x="12" y="12" width="160" height="180" fill="#64e4bd"/>
      <path d="M12 36h160" stroke="#217b6b"/>
      <circle cx="25" cy="24" r="3" fill="#217b6b"/>
      <path d="M30 58h92m-92 14h115m-115 14h75" stroke="#217b6b" stroke-width="4" opacity=".45"/>
      <text x="172" y="267" text-anchor="middle" fill="#e6f4f5" font-size="21" font-weight="600">Left half</text>
      <rect x="94" y="283" width="156" height="35" rx="8" fill="#0b1925" stroke="#398d99"/>
      <text x="172" y="306" text-anchor="middle" fill="#64e4bd" font-size="17">Ctrl + Alt + 1</text>
    </g>
    <g transform="translate(428 115)">
      <use href="#monitor"/>
      <rect x="92" y="57" width="160" height="90" fill="#64e4bd"/>
      <path d="M92 81h160" stroke="#217b6b"/>
      <circle cx="105" cy="69" r="3" fill="#217b6b"/>
      <path d="M110 103h92m-92 14h115m-115 14h75" stroke="#217b6b" stroke-width="4" opacity=".45"/>
      <text x="172" y="267" text-anchor="middle" fill="#e6f4f5" font-size="21" font-weight="600">Center</text>
      <rect x="94" y="283" width="156" height="35" rx="8" fill="#0b1925" stroke="#398d99"/>
      <text x="172" y="306" text-anchor="middle" fill="#64e4bd" font-size="17">Ctrl + Alt + 3</text>
    </g>
    <g transform="translate(816 115)">
      <use href="#monitor"/>
      <rect x="172" y="12" width="160" height="90" fill="#64e4bd"/>
      <path d="M172 36h160" stroke="#217b6b"/>
      <circle cx="185" cy="24" r="3" fill="#217b6b"/>
      <path d="M190 58h92m-92 14h115m-115 14h75" stroke="#217b6b" stroke-width="4" opacity=".45"/>
      <text x="172" y="267" text-anchor="middle" fill="#e6f4f5" font-size="21" font-weight="600">Top-right quarter</text>
      <rect x="94" y="283" width="156" height="35" rx="8" fill="#0b1925" stroke="#398d99"/>
      <text x="172" y="306" text-anchor="middle" fill="#64e4bd" font-size="17">Ctrl + Alt + 9</text>
    </g>
  </g>
</svg>
