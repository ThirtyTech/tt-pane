[workspace]
members = ["crates/tt-pane-platform"]
exclude = ["vendor/block", "vendor/gpui", "vendor/proc-macro-error2", "vendor/xattr"]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[package]
name = "tt-pane"
version = "0.2.1"
edition = "2024"
description = "Keyboard-first native window positioning"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:smol", "dep:tray-icon", "tt-pane-platform/window-icon"]

[dependencies]
tt-pane-platform = { path = "crates/tt-pane-platform" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
global-hotkey = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tempfile = "3"
semver = "1"
sha2 = "0.10"
gpui = { version = "=0.2.2", features = ["keep-alive", "preserve-numpad"], optional = true }
smol = { version = "2", optional = true }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"

[dev-dependencies]
tt-pane-platform = { path = "crates/tt-pane-platform", features = ["test-support"] }

[profile.dev]
debug = 0

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"


[patch.crates-io]
block = { path = "vendor/block" }
gpui = { path = "vendor/gpui" }
proc-macro-error2 = { path = "vendor/proc-macro-error2" }
xattr = { path = "vendor/xattr" }
