[package]
name = "tt-pane-platform"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Safe native window-control interfaces for tt-pane"

[features]
window-icon = ["dep:raw-window-handle"]
test-support = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls_Dialogs", "Win32_System_Console", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSResponder", "NSScreen", "NSWorkspace", "NSRunningApplication"] }
