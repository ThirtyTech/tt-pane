    <text x="68" y="185" fill="#64e4bd" font-size="13" font-weight="700" letter-spacing="3">YOUR DESKTOP, IN POSITION</text>
    <text x="64" y="279" fill="#f0f1f3" font-size="76" font-weight="650" letter-spacing="-4">Make room</text>
    <text x="64" y="370" fill="#f0f1f3" font-size="76" font-weight="650" letter-spacing="-4">for <tspan fill="#64e4bd" font-family="Georgia, serif" font-style="italic" font-weight="400">your flow.</tspan></text>
    <text x="68" y="430" fill="#adb3bf" font-size="23">Snap, grow, and fine-tune your workspace.</text>
    <text x="68" y="465" fill="#adb3bf" font-size="23">All from your keyboard.</text>
    <text x="68" y="561" fill="#adb3bf" font-size="16" letter-spacing="1">WINDOWS / macOS / LINUX</text>
  </g>
  <!-- Dashed destinations remain visible around the incoming windows. -->
