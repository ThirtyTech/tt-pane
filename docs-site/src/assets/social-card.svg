<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow"><stop stop-color="#233e40"/><stop offset="1" stop-color="#101216"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#adb3bf" opacity=".12"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="#101216"/>
  <ellipse cx="955" cy="305" rx="430" ry="370" fill="url(#glow)"/>
